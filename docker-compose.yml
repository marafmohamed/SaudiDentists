version: '3'
services:
  backend:
    image: marafmohamedislam/saudi-dentists-backend:1.0.0
    container_name: backend
    environment:
      - WEBSITES_ENABLE_APP_SERVICE_STORAGE=true
    restart: always
    networks:
      - app-network

  frontend:
    image: marafmohamedislam/saudi-dentists-frontend:1.0.0
    container_name: frontend
    environment:
      - WEBSITES_ENABLE_APP_SERVICE_STORAGE=true
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  nginx:
    image: marafmohamedislam/saudi-dentists-nginx:1.0.0
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ${WEBAPP_STORAGE_HOME}/site/wwwroot/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: always

networks:
  app-network:
    name: app-network
    driver: bridge
